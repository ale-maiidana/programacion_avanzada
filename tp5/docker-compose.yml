services:
  db:
    image: postgres:16
    container_name: task-db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./backend
    container_name: task-api
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - db

  web:
    build: ./frontend
    container_name: task-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
